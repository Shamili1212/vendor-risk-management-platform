services:
  postgres:
    image: postgres:16
    container_name: vendor_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_risk_db
      POSTGRES_USER: vendor_user
      POSTGRES_PASSWORD: vendor_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vendor_risk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vendor_risk_api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vendor_risk_db;Username=vendor_user;Password=vendor_password
      Jwt__Issuer: VendorRisk
      Jwt__Audience: VendorRisk.Client
      Jwt__Key: local-development-key-change-before-production-12345
      Frontend__Origin: http://localhost:5173
      RiskEngine__Path: /app/risk_engine
      Database__EnsureCreatedOnStartup: "true"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
    container_name: vendor_risk_frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
