services:
  postgres:
    image: postgres:16
    container_name: vendor_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_risk_db
      POSTGRES_USER: vendor_user
      POSTGRES_PASSWORD: vendor_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vendor_risk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: